<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Trau dich! · Sicherer Browser-Testlauf</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 14px system-ui;
        background: #e8eee7;
        color: #234f41;
      }
      header {
        padding: 18px 22px;
        background: #234f41;
        color: white;
        display: flex;
        gap: 18px;
        align-items: center;
        flex-wrap: wrap;
      }
      header p {
        margin: 0;
        font-size: 12px;
      }
      button,
      select {
        font: inherit;
        padding: 8px 12px;
        border: 1px solid #9bac94;
        border-radius: 7px;
        background: #fffcf2;
        color: #234f41;
        cursor: pointer;
      }
      main {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 20px;
        padding: 20px;
      }
      .results {
        background: #fffcf2;
        border-radius: 10px;
        padding: 18px;
        max-height: 80vh;
        overflow: auto;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      #summary {
        font-weight: bold;
        font-size: 17px;
      }
      li {
        padding: 5px 0;
        font-size: 11px;
        line-height: 1.4;
      }
      .pass {
        color: #285c3c;
      }
      .fail {
        color: #af3525;
      }
      .frame-wrap {
        position: relative;
        overflow: hidden;
        min-height: 850px;
      }
      iframe {
        border: 0;
        background: #edf4e9;
        transform-origin: top left;
        box-shadow: 0 4px 30px #21412f20;
      }
      body.preview main {
        display: block;
      }
      body.preview .results {
        display: none;
      }
      body.preview .frame-wrap {
        margin: auto;
        width: max-content;
      }
      textarea {
        width: 100%;
        height: 180px;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>TEST · Keine echte Übermittlung</strong>
      <p>Alle Formularanfragen werden im Testfenster abgefangen.</p>
      <select id="preview-size" aria-label="Vorschaugröße">
        <option value="1440x900">Desktop · 1440 × 900</option>
        <option value="1280x720">Laptop · 1280 × 720</option>
        <option value="768x1024">Tablet · 768 × 1024</option>
        <option value="390x844">Smartphone · 390 × 844</option>
        <option value="320x568">Schmal · 320 × 568</option>
        <option value="2560x1080">Ultrawide · 2560 × 1080</option></select
      ><button id="run" type="button">Tests starten</button
      ><a href="../../">Zur echten Umfrage</a>
    </header>
    <main>
      <section class="results">
        <h1>Browser-Integrationstests</h1>
        <p id="summary" role="status">Bereit.</p>
        <ol id="results"></ol>
        <details>
          <summary>JSON-Testbericht</summary>
          <textarea id="report" readonly></textarea>
        </details>
      </section>
      <div class="frame-wrap" id="frame-wrap">
        <iframe
          id="test-frame"
          title="Isolierte, ausschließlich simulierte Test-Umfrage"
          sandbox="allow-scripts allow-same-origin allow-forms"
        ></iframe>
      </div>
    </main>
    <script type="module" src="./runner.js"></script>
  </body>
</html>
